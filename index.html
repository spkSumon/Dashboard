<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      padding: 20px;
    }

    .inbox-app {
      width: 100%;
      max-width: 1100px;
      height: 700px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex;
    }

    .sidebar {
      width: 35%;
      min-width: 280px;
      border-right: 1px solid #e5e7eb;
      background: #fafafa;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .sidebar-header h2 {
      font-size: 22px;
      color: #111827;
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
    }

    .message-list {
      overflow-y: auto;
      flex: 1;
    }

    .message-item {
      padding: 16px 18px;
      border-bottom: 1px solid #ececec;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .message-item:hover {
      background: #f3f4f6;
    }

    .message-item.active {
      background: #e8f0fe;
    }

    .message-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .message-name {
      font-weight: bold;
      color: #111827;
    }

    .message-time {
      font-size: 12px;
      color: #6b7280;
    }

    .message-preview {
      font-size: 14px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .content-header {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .content-header h3 {
      font-size: 22px;
      color: #111827;
      margin-bottom: 6px;
    }

    .content-header p {
      color: #6b7280;
      font-size: 14px;
    }

    .content-body {
      padding: 24px;
      overflow-y: auto;
      line-height: 1.6;
      color: #1f2937;
      font-size: 15px;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #9ca3af;
      font-size: 18px;
    }

    @media (max-width: 800px) {
      .inbox-app {
        flex-direction: column;
        height: auto;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
      }

      .content {
        min-height: 350px;
      }
    }
  </style>
</head>
<body>

  <div class="inbox-app">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Inbox</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Zoek op naam..." />
        </div>
      </div>

      <div class="message-list" id="messageList"></div>
    </div>

    <div class="content" id="contentArea">
      <div class="empty-state">Kies een bericht om te lezen</div>
    </div>
  </div>

  <script>
    const messages = [
      {
        id: 1,
        name: "Sofie Maes",
        time: "09:12",
        preview: "Hallo, ik had graag wat meer info over jullie diensten...",
        subject: "Vraag over diensten",
        fullMessage: "Hallo,\n\nIk had graag wat meer info over jullie diensten en welke mogelijkheden er zijn voor mijn zaak.\n\nMet vriendelijke groeten,\nSofie"
      },
      {
        id: 2,
        name: "Tom Peeters",
        time: "10:45",
        preview: "Bedankt voor je snelle antwoord. Ik bekijk het even...",
        subject: "Re: Offerte",
        fullMessage: "Bedankt voor je snelle antwoord.\n\nIk bekijk de offerte even en laat je snel iets weten.\n\nGroeten,\nTom"
      },
      {
        id: 3,
        name: "Laura Jacobs",
        time: "11:30",
        preview: "Kunnen we volgende week eens afspreken om dit te bespreken?",
        subject: "Afspraak maken",
        fullMessage: "Dag,\n\nKunnen we volgende week eens afspreken om alles rustig te bespreken?\n\nLaat maar weten welke momenten passen.\n\nGroetjes,\nLaura"
      },
      {
        id: 4,
        name: "Arne Willems",
        time: "13:05",
        preview: "Ik heb nog een vraag over de planning van het project.",
        subject: "Projectplanning",
        fullMessage: "Hallo,\n\nIk heb nog een vraag over de planning van het project en de volgende stappen.\n\nAlvast bedankt.\n\nArne"
      }
    ];

    const messageList = document.getElementById("messageList");
    const contentArea = document.getElementById("contentArea");
    const searchInput = document.getElementById("searchInput");

    function renderMessages(filter = "") {
      messageList.innerHTML = "";

      const filteredMessages = messages.filter(message =>
        message.name.toLowerCase().includes(filter.toLowerCase())
      );

      filteredMessages.forEach(message => {
        const item = document.createElement("div");
        item.className = "message-item";
        item.dataset.id = message.id;

        item.innerHTML = `
          <div class="message-top">
            <div class="message-name">${message.name}</div>
            <div class="message-time">${message.time}</div>
          </div>
          <div class="message-preview">${message.preview}</div>
        `;

        item.addEventListener("click", () => {
          document.querySelectorAll(".message-item").forEach(el => el.classList.remove("active"));
          item.classList.add("active");

          contentArea.innerHTML = `
            <div class="content-header">
              <h3>${message.subject}</h3>
              <p>Van: ${message.name} • ${message.time}</p>
            </div>
            <div class="content-body">
              ${message.fullMessage.replace(/\n/g, "<br>")}
            </div>
          `;
        });

        messageList.appendChild(item);
      });

      if (filteredMessages.length === 0) {
        messageList.innerHTML = `<div class="message-item">Geen berichten gevonden</div>`;
      }
    }

    searchInput.addEventListener("input", (e) => {
      renderMessages(e.target.value);
    });

    renderMessages();
  </script>

</body>
</html>
