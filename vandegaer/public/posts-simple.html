<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Posts Test - Simple</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
            background: #0f172a;
            color: #e2e8f0;
        }
        h1 { margin-bottom: 20px; color: #38bdf8; }
        .stats {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stats span {
            color: #22c55e;
            font-size: 32px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #334155;
            color: #38bdf8;
            font-weight: 600;
        }
        tr:hover { background: #334155; }
        .platform {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .platform.tiktok { background: #000; color: #fff; }
        .platform.instagram { background: #E4405F; color: #fff; }
        .platform.facebook { background: #1877F2; color: #fff; }
        .error {
            background: #7f1d1d;
            color: #fecaca;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <h1>📊 Posts Test - Simplified</h1>

    <div class="stats" id="stats">
        <div class="loading">Loading posts...</div>
    </div>

    <div id="error"></div>

    <table id="postsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Platform</th>
                <th>Caption</th>
                <th>Date</th>
                <th>Views</th>
                <th>Likes</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="6" style="text-align: center; padding: 40px; color: #64748b;">Loading...</td></tr>
        </tbody>
    </table>

    <script>
        // Auto-detect base path
        const BASE_PATH = window.location.pathname.replace(/\/[^\/]*$/, '');

        async function loadPosts() {
            const statsDiv = document.getElementById('stats');
            const errorDiv = document.getElementById('error');
            const tbody = document.getElementById('tableBody');

            try {
                console.log('Fetching from:', BASE_PATH + '/api/posts?limit=50');

                const response = await fetch(BASE_PATH + '/api/posts?limit=50');

                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const posts = await response.json();

                console.log('Posts received:', posts.length);
                console.log('First post:', posts[0]);

                if (!Array.isArray(posts)) {
                    throw new Error('Response is not an array');
                }

                // Update stats
                statsDiv.innerHTML = `
                    <strong>Total posts loaded:</strong> <span>${posts.length}</span>
                `;

                // Clear table
                tbody.innerHTML = '';

                // Populate table
                if (posts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #94a3b8;">No posts found</td></tr>';
                    return;
                }

                posts.forEach(post => {
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${post.id}</td>
                        <td><span class="platform ${post.platform}">${post.platform}</span></td>
                        <td style="max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${escapeHtml(post.caption || 'No caption')}
                        </td>
                        <td>${post.posted_date || 'N/A'}</td>
                        <td>${formatNumber(post.views || 0)}</td>
                        <td>${formatNumber(post.likes || 0)}</td>
                    `;
                });

                console.log('✅ Posts rendered successfully!');

            } catch (error) {
                console.error('❌ Error:', error);

                statsDiv.innerHTML = '<strong style="color: #ef4444;">Error loading posts</strong>';

                errorDiv.innerHTML = `
                    <div class="error">
                        <strong>⚠️ Failed to load posts</strong><br>
                        ${error.message}<br><br>
                        <strong>Debug info:</strong><br>
                        API URL: ${BASE_PATH}/api/posts<br>
                        Check browser console for details.
                    </div>
                `;

                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: #ef4444;">
                            Failed to load posts. Check console for errors.
                        </td>
                    </tr>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('nl-BE').format(num);
        }

        // Load posts on page load
        window.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
