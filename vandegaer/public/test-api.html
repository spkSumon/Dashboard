<!DOCTYPE html>
<html>
<head>
    <title>API Test - Posts</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        pre { background: #2a2a2a; padding: 15px; border-radius: 8px; overflow-x: auto; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #45a049; }
        .error { color: #ff4444; }
        .success { color: #44ff44; }
    </style>
</head>
<body>
    <h1>🔍 SocialBit API Test</h1>
    <button onclick="testPostsAPI()">Test /api/posts</button>
    <button onclick="testPostsAPIWithParams()">Test /api/posts?limit=5</button>
    <button onclick="testHealthAPI()">Test /api/health</button>

    <div id="result"></div>

    <script>
        const BASE_URL = window.location.pathname.replace(/\/[^\/]*$/, '');

        async function testPostsAPI() {
            const result = document.getElementById('result');
            result.innerHTML = '<h3>Testing /api/posts...</h3>';

            try {
                const url = BASE_URL + '/api/posts';
                console.log('Fetching:', url);

                const response = await fetch(url);
                const data = await response.json();

                result.innerHTML += `<p class="success">✓ Response status: ${response.status}</p>`;
                result.innerHTML += `<p>Data type: ${Array.isArray(data) ? 'Array' : typeof data}</p>`;
                result.innerHTML += `<p>Posts count: ${Array.isArray(data) ? data.length : 'N/A'}</p>`;
                result.innerHTML += `<h4>Raw response:</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;

                if (Array.isArray(data) && data.length > 0) {
                    result.innerHTML += `<h4>First post:</h4><pre>${JSON.stringify(data[0], null, 2)}</pre>`;
                }
            } catch (error) {
                result.innerHTML += `<p class="error">❌ Error: ${error.message}</p>`;
                console.error(error);
            }
        }

        async function testPostsAPIWithParams() {
            const result = document.getElementById('result');
            result.innerHTML = '<h3>Testing /api/posts?limit=5...</h3>';

            try {
                const url = BASE_URL + '/api/posts?limit=5';
                console.log('Fetching:', url);

                const response = await fetch(url);
                const data = await response.json();

                result.innerHTML += `<p class="success">✓ Response status: ${response.status}</p>`;
                result.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML += `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        async function testHealthAPI() {
            const result = document.getElementById('result');
            result.innerHTML = '<h3>Testing /api/health...</h3>';

            try {
                const url = BASE_URL + '/api/health';
                const response = await fetch(url);
                const data = await response.json();

                result.innerHTML += `<p class="success">✓ Health check passed</p>`;
                result.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML += `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
