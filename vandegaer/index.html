<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 SocialBit - Jungle Analytics Dashboard</title>

  <!-- Jungle Theme CSS -->
  <link rel="stylesheet" href="public/assets/jungle-theme.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated jungle leaves background */
    .jungle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .leaf {
      position: absolute;
      font-size: 2rem;
      opacity: 0.05;
      animation: float 20s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-30px) rotate(10deg);
      }
    }

    .leaf:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .leaf:nth-child(2) { top: 20%; left: 80%; animation-delay: 2s; }
    .leaf:nth-child(3) { top: 40%; left: 20%; animation-delay: 4s; }
    .leaf:nth-child(4) { top: 60%; left: 70%; animation-delay: 6s; }
    .leaf:nth-child(5) { top: 80%; left: 40%; animation-delay: 8s; }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 600px;
      padding: 3rem;
    }

    .welcome-card {
      background: linear-gradient(135deg, rgba(26, 58, 31, 0.9), rgba(13, 27, 14, 0.9));
      backdrop-filter: blur(10px);
      border: 2px solid rgba(46, 204, 113, 0.4);
      border-radius: var(--radius-2xl);
      padding: 3rem;
      box-shadow: 0 20px 60px rgba(57, 255, 20, 0.2);
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .logo {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--jungle-glow), var(--jungle-accent), var(--jungle-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #7fda89;
      font-size: 1rem;
      margin-bottom: 2rem;
      font-style: italic;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn-link {
      text-decoration: none;
    }

    .redirect-timer {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(10, 14, 10, 0.6);
      border-radius: var(--radius-md);
      border: 1px solid rgba(46, 204, 113, 0.3);
      font-size: 0.875rem;
      color: #7fda89;
    }

    .timer-countdown {
      color: var(--jungle-glow);
      font-weight: 700;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <!-- Animated jungle background -->
  <div class="jungle-bg">
    <div class="leaf">🌿</div>
    <div class="leaf">🍃</div>
    <div class="leaf">🌿</div>
    <div class="leaf">🍃</div>
    <div class="leaf">🌿</div>
  </div>

  <div class="container">
    <div class="welcome-card">
      <div class="logo">🌿</div>
      <h1 class="glow-text">SocialBit</h1>
      <p class="subtitle">// Jungle Analytics - Real-time Social Media Survival Dashboard</p>

      <div class="btn-container">
        <a href="jungle.html" class="btn-link">
          <button class="btn btn-primary btn-pulse">
            🚀 Enter Jungle Dashboard
          </button>
        </a>

        <a href="api-connector.html" class="btn-link">
          <button class="btn btn-secondary">
            🔌 API Connection Lab
          </button>
        </a>

        <a href="socialbit-data-explorer.html" class="btn-link">
          <button class="btn btn-secondary">
            🔍 Data Source Explorer
          </button>
        </a>

        <a href="index-jungle.html" class="btn-link">
          <button class="btn btn-secondary">
            🏠 Marketing Landing Page
          </button>
        </a>
      </div>

      <div class="redirect-timer">
        <div>Auto-redirecting to Jungle Dashboard in</div>
        <div class="timer-countdown" id="countdown">5</div>
        <div style="font-size: 0.75rem; margin-top: 0.5rem; color: #4a6f4f;">
          Click any button to navigate immediately
        </div>
      </div>
    </div>
  </div>

  <script>
    // Auto-redirect countdown
    let countdown = 5;
    const countdownEl = document.getElementById('countdown');

    const interval = setInterval(() => {
      countdown--;
      countdownEl.textContent = countdown;

      if (countdown <= 0) {
        clearInterval(interval);
        window.location.href = 'jungle.html';
      }
    }, 1000);

    // Stop countdown if user clicks any link
    document.querySelectorAll('.btn-link').forEach(link => {
      link.addEventListener('click', () => {
        clearInterval(interval);
      });
    });
  </script>
</body>
</html>
